name: Test & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Run site integrity checks
        run: npm run site

  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      # The live service to verify. Override it with a repository variable
      # named LIVE_SITE_URL when the service changes; the default below is the
      # current live deployment (service gracious-peace, project
      # attractive-rejoicing).
      LIVE_SITE_URL: ${{ vars.LIVE_SITE_URL || 'https://gracious-peace-production-d056.up.railway.app' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deployed site
        run: node scripts/verifyLive.mjs "$LIVE_SITE_URL"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}